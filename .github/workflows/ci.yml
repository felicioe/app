name: Thera Workspace CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos e build do frontend
        run: npm run build

      - name: Verificar contrato frontend
        run: node scripts/check-frontend-contract.mjs

      - name: Empacotar frontend para publicação
        uses: actions/upload-artifact@v4
        with:
          name: thera-workspace-frontend
          path: dist
          if-no-files-found: error
          retention-days: 14

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, fileinfo, zip, pdo_mysql

      - name: Verificar sintaxe PHP
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find api -type f -name '*.php' -print0)

      - name: Executar testes da API
        run: php api/tests/run.php

      - name: Verificar artefatos de publicação
        run: |
          test -f public/.htaccess
          test -f api/auth/login.php
          test -f api/auth/me.php
          test -f api/health.php
          test -f api/flow/documentos.php
          test -f api/flow/cliente.php
